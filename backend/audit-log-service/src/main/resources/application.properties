spring.datasource.url=jdbc:postgresql://localhost:5432/auditlogdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.datasource.driver-class-name=org.postgresql.Driver

# Local-only defaults. Set these environment variables before sharing or deploying the service.
audit.security.admin.username=${AUDIT_ADMIN_USERNAME:admin}
audit.security.admin.password=${AUDIT_ADMIN_PASSWORD:change-me-admin}
audit.security.auditor.username=${AUDIT_AUDITOR_USERNAME:auditor}
audit.security.auditor.password=${AUDIT_AUDITOR_PASSWORD:change-me-auditor}