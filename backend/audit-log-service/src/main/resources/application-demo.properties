# DEMO PROFILE ONLY - never use in production.
# Activates a hardcoded shared-secret JWT decoder instead of a real OIDC identity provider,
# so the API can be exercised end-to-end (e.g. via Swagger) without running Keycloak.
security.jwt.demo-secret=${DEMO_JWT_SECRET:demo-only-shared-secret-key-please-rotate-32bytes-min}
